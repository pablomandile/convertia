<!doctype html>
<html lang="es">
<body style="margin:0;padding:24px;background:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0f172a">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:28px">
    <p style="margin:0 0 8px;font-size:20px;font-weight:700;color:#0f766e">Convertia</p>
    <p style="margin:0 0 20px;font-size:16px">Para entrar a tu cuenta, tocá el botón:</p>
    <p style="margin:0 0 24px">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px">Entrar a Convertia</a>
    </p>
    <p style="margin:0 0 8px;font-size:14px;color:#475569">¿Usás la app instalada en el celular? Escribí este código en la pantalla de ingreso:</p>
    <p style="margin:0 0 24px;font-size:28px;font-weight:700;letter-spacing:6px;font-family:ui-monospace,Menlo,Consolas,monospace">{{ .Token }}</p>
    <p style="margin:0;font-size:12px;color:#64748b">El link y el código vencen en una hora. Si no pediste entrar, ignorá este mail: nadie puede usar tu cuenta sin él.</p>
  </div>
</body>
</html>
